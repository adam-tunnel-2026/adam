name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Configurar de forma nativa las herramientas del SDK antiguo usando una acción oficial
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 28
          build-tools: 28.0.3

      # 2. Configurar JDK 8 para que el Gradle antiguo de la app pueda compilar
      - name: Set up JDK 8 for Gradle
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"

      # 3. Aplicar el parche de compatibilidad XML
      - name: Apply Legacy Compatibility Patch
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/platforms/android-28/data"
          touch "$ANDROID_HOME/platforms/android-28/data/layoutlib.data"
          echo "Parche de compatibilidad aplicado correctamente."

      # 4. Compilar la aplicación
      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          
          echo "=== VERIFICANDO ENTORNO ==="
          java -version
          ./gradlew --version
          
          echo "=== EJECUTANDO COMPILACION ==="
          ./gradlew assembleDebug -x test -x lint --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adam-tunnel-app
          path: app/build/outputs/apk/debug/app-debug.apk
