name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Configurar el SDK mediante el método oficial y actualizado
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 2. Descargar de forma nativa los componentes clásicos usando el sdkmanager correcto
      - name: Install Android 28 Components
        shell: bash
        run: |
          sdkmanager "platforms;android-28" "build-tools;28.0.3" "platform-tools"

      # 3. Forzar el aislamiento del entorno inyectando el parche contra 'base-extension'
      - name: Apply Compatibility Patch
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/platforms/android-28/data"
          touch "$ANDROID_HOME/platforms/android-28/data/layoutlib.data"
          echo "Parche de compatibilidad estructural aplicado."

      # 4. Compilar con JDK 8 de principio a fin para la app clásica
      - name: Set up JDK 8 for Gradle
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew

          echo "=== VERIFICANDO ENTORNO ==="
          java -version
          ./gradlew --version

          echo "=== EJECUTANDO COMPILACION ==="
          ./gradlew assembleDebug -x test -x lint --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adam-tunnel-app
          path: app/build/outputs/apk/debug/app-debug.apk
