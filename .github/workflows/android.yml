name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Android SDK 28 and 33
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROID_HOME="/usr/local/lib/android/sdk"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-28" \
            "platforms;android-33" \
            "build-tools;28.0.3" \
            "build-tools;33.0.0" \
            "platform-tools"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Build and show dependency information
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROID_HOME="/usr/local/lib/android/sdk"

          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          chmod +x gradlew

          echo "=== JAVA ==="
          java -version

          echo "=== GRADLE ==="
          ./gradlew --version

          echo "=== SERVICE DEPENDENCIES ==="
          ./gradlew :service:dependencies --configuration debugCompile

          echo "=== APP DEPENDENCIES ==="
          ./gradlew :app:dependencies --configuration debugCompile

          echo "=== BUILD ==="
          ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adam-tunnel-app
          path: app/build/outputs/apk/debug/app-debug.apk
