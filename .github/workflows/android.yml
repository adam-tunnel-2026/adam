name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Forzamos Java 8 para que incluya las librerías javax.xml eliminadas en versiones nuevas
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"

      # Instalamos de forma limpia los componentes del SDK necesarios
      - name: Install Android SDK Components
        shell: bash
        run: |
          export SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "=== ACEPTANDO LICENCIAS ==="
          (echo y; echo y; echo y; echo y) | $SDKMANAGER --licenses || true
          echo "=== INSTALANDO PLATAFORMA ==="
          $SDKMANAGER "platforms;android-28" "build-tools;28.0.3" "platform-tools"

      # Aplicamos el parche contra el error 'base-extension' de tu Gradle antiguo
      - name: Apply Compatibility Patch
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/platforms/android-28/data"
          touch "$ANDROID_HOME/platforms/android-28/data/layoutlib.data"

      # Compilación final del APK
      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          echo "=== COMPILANDO APLICACION SOCKSHTTP ==="
          ./gradlew assembleDebug -x test -x lint --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adam-tunnel-app
          path: app/build/outputs/apk/debug/app-debug.apk
