name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Install and Force Legacy Android SDK 28
        shell: bash
        run: |
          export ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk-custom"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          
          curl -sS https://google.com -o commandlinetools.zip
          unzip -q commandlinetools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          
          yes | $SDKMANAGER --licenses > /dev/null || true
          
          echo "Instalando Platform 28 y Build Tools 28.0.3..."
          $SDKMANAGER "platforms;android-28" "build-tools;28.0.3" "platform-tools" > /dev/null
          
          mkdir -p "$ANDROID_HOME/platforms/android-28/data"
          touch "$ANDROID_HOME/platforms/android-28/data/layoutlib.data"
          
          echo "=== CONFIGURACION DE SDK COMPLETADA ==="

      - name: Build APK
        shell: bash
        run: |
          export ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk-custom"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          
          chmod +x gradlew
          
          echo "=== VERIFICANDO ENTORNO ==="
          java -version
          ./gradlew --version
          
          echo "=== EJECUTANDO COMPILACION ==="
          ./gradlew assembleDebug -x test -x lint --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adam-tunnel-app
          path: app/build/outputs/apk/debug/app-debug.apk
