name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8 for Gradle
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Local Copy and Isolation of Android SDK 28
        shell: bash
        run: |
          # 1. Definir rutas (Usando el SDK que ya viene instalado de fábrica en GitHub)
          export ORIGINAL_SDK="$ANDROID_HOME"
          export CUSTOM_SDK="$GITHUB_WORKSPACE/android-sdk-custom"

          echo "=== CONFIGURANDO ENTORNO AISLADO ==="
          mkdir -p "$CUSTOM_SDK/platforms"
          mkdir -p "$CUSTOM_SDK/build-tools"

          # 2. Copiar de forma local las carpetas exactas (Evita descargar nada de internet)
          echo "Copiando Plataforma Android 28 local..."
          cp -r "$ORIGINAL_SDK/platforms/android-28" "$CUSTOM_SDK/platforms/"

          echo "Copiando Herramientas de Compilación 28.0.3 locales..."
          cp -r "$ORIGINAL_SDK/build-tools/28.0.3" "$CUSTOM_SDK/build-tools/"

          echo "Copiando Platform Tools locales..."
          cp -r "$ORIGINAL_SDK/platform-tools" "$CUSTOM_SDK/"

          # 3. Inyectar el parche manual contra el error estructural XML 'base-extension'
          mkdir -p "$CUSTOM_SDK/platforms/android-28/data"
          touch "$CUSTOM_SDK/platforms/android-28/data/layoutlib.data"

          echo "=== CONFIGURACION LOCAL COMPLETADA CON EXITO ==="

      - name: Build APK
        shell: bash
        run: |
          # Enlazar las variables del sistema únicamente a nuestro SDK aislado
          export ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk-custom"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/28.0.3:$PATH"

          chmod +x gradlew

          echo "=== VERIFICANDO ENTORNO DE COMPILACION ==="
          java -version
          ./gradlew --version

          echo "=== COMPILANDO APLICACION SOCKSHTTP ==="
          ./gradlew assembleDebug -x test -x lint --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adam-tunnel-app
          path: app/build/outputs/apk/debug/app-debug.apk
