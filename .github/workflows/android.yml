name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Configurar JDK moderno temporalmente SOLO para aceptar las licencias e instalar los componentes antiguos
      - name: Set up JDK 17 for SDK Manager
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Android SDK 28 Cleanly
        shell: bash
        run: |
          # Localizar las herramientas preinstaladas de GitHub Actions
          export SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          
          echo "=== ACEPTANDO TODAS LAS LICENCIAS DE GOOGLE ==="
          yes | $SDKMANAGER --licenses > /dev/null || true
          
          echo "=== INSTALANDO PLATAFORMA 28 Y BUILD-TOOLS 28.0.3 ==="
          yes | $SDKMANAGER "platforms;android-28" "build-tools;28.0.3" "platform-tools" > /dev/null
          
          # 2. Aplicar el parche de compatibilidad contra el error 'base-extension' de tu Gradle antiguo
          mkdir -p "$ANDROID_HOME/platforms/android-28/data"
          touch "$ANDROID_HOME/platforms/android-28/data/layoutlib.data"
          
          echo "=== SDK CONFIGURADO CON EXITO ==="

      # 3. Cambiar a JDK 8, requerido obligatoriamente para compilar este proyecto clásico
      - name: Set up JDK 8 for Gradle Build
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          
          echo "=== VERIFICANDO ENTORNO ==="
          java -version
          ./gradlew --version
          
          echo "=== INICIANDO COMPILACION ==="
          ./gradlew assembleDebug -x test -x lint --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adam-tunnel-app
          path: app/build/outputs/apk/debug/app-debug.apk
