name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Android SDK 28 and 33
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROID_HOME="/usr/local/lib/android/sdk"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-28" \
            "platforms;android-33" \
            "build-tools;28.0.3" \
            "build-tools;33.0.0" \
            "platform-tools"

          echo "=== INSTALLED PLATFORMS ==="
          ls -la "$ANDROID_SDK_ROOT/platforms"

          echo "=== INSTALLED BUILD TOOLS ==="
          ls -la "$ANDROID_SDK_ROOT/build-tools"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROID_HOME="/usr/local/lib/android/sdk"

          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"

          java -version
          ./gradlew --version

          echo "=== CHECK API 28 ==="
          test -d "$ANDROID_SDK_ROOT/platforms/android-28"
          echo "API 28 OK"

          echo "=== CHECK API 33 ==="
          test -d "$ANDROID_SDK_ROOT/platforms/android-33"
          echo "API 33 OK"

          echo "=== CHECK BUILD TOOLS 28.0.3 ==="
          test -d "$ANDROID_SDK_ROOT/build-tools/28.0.3"
          echo "Build Tools 28.0.3 OK"

          echo "=== CHECK BUILD TOOLS 33.0.0 ==="
          test -d "$ANDROID_SDK_ROOT/build-tools/33.0.0"
          echo "Build Tools 33.0.0 OK"

          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adam-tunnel-app
          path: app/build/outputs/apk/debug/app-debug.apk
