name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8 for Gradle
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Manual Clean Installation of Android SDK 28
        shell: bash
        run: |
          # 1. Crear directorios aislados y limpios para evitar herramientas modernas
          export ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk-custom"
          mkdir -p "$ANDROID_HOME/platforms"
          mkdir -p "$ANDROID_HOME/build-tools"
          mkdir -p "$ANDROID_HOME/platform-tools"

          # 2. Descargar de forma estática la plataforma Android 28 usando wget
          echo "Descargando Android Platform 28..."
          wget -q --show-progress https://dl.google.com/android/repository/platform-28_r04.zip -O platform.zip
          unzip -q platform.zip -d "$ANDROID_HOME/platforms"
          mv "$ANDROID_HOME/platforms/android-9" "$ANDROID_HOME/platforms/android-28"

          # 3. Descargar las herramientas de compilación clásicas 28.0.3
          echo "Descargando Build Tools 28.0.3..."
          wget -q --show-progress https://google.com -O build-tools.zip
          unzip -q build-tools.zip -d "$ANDROID_HOME/build-tools"
          mv "$ANDROID_HOME/build-tools/android-9" "$ANDROID_HOME/build-tools/28.0.3"

          # 4. Descargar Platform Tools para la estructura correcta
          echo "Descargando Platform Tools..."
          wget -q --show-progress https://google.com -O platform-tools.zip
          unzip -q platform-tools.zip -d "$ANDROID_HOME"

          # 5. Parche manual contra el error de estructura XML 'base-extension'
          mkdir -p "$ANDROID_HOME/platforms/android-28/data"
          touch "$ANDROID_HOME/platforms/android-28/data/layoutlib.data"

          echo "=== CONFIGURACION MANUAL DEL SDK COMPLETADA ==="

      - name: Build APK
        shell: bash
        run: |
          # Declarar las variables apuntando a nuestro SDK libre de elementos modernos
          export ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk-custom"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/28.0.3:$PATH"

          chmod +x gradlew

          echo "=== VERIFICANDO ENTORNO ==="
          java -version
          ./gradlew --version

          echo "=== COMPILANDO APLICACION SOCKSHTTP ==="
          ./gradlew assembleDebug -x test -x lint --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adam-tunnel-app
          path: app/build/outputs/apk/debug/app-debug.apk
