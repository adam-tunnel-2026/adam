name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Usamos una acción oficial estable para instalar el SDK sin comandos conflictivos
      - name: Setup Android SDK Environment
        uses: android-actions/setup-android@v3

      # 2. Descargamos la plataforma antigua usando una sintaxis que no traba las licencias
      - name: Aprovisionar Android SDK 28
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "build-tools;28.0.3" "platform-tools"

      # 3. Aplicamos el parche de compatibilidad para tu Gradle antiguo
      - name: Apply Patch
        run: |
          mkdir -p "$ANDROID_HOME/platforms/android-28/data"
          touch "$ANDROID_HOME/platforms/android-28/data/layoutlib.data"

      # 4. Ponemos Java 8 JUSTO ANTES de compilar para evitar el fallo de javax.xml
      - name: Set up JDK 8 for Legacy Build
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"

      # 5. Compilación del APK final de SocksHttp
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -x test -x lint --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adam-tunnel-app
          path: app/build/outputs/apk/debug/app-debug.apk
