name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Configurar JDK moderno temporalmente para las herramientas del SDK
      - name: Set up JDK 17 for SDK Manager
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Android SDK 28 Cleanly
        shell: bash
        run: |
          export SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "=== ACEPTANDO TODAS LAS LICENCIAS DE GOOGLE ==="
          # Usamos un bucle continuo seguro para evitar el error de Broken pipe
          (echo y; echo y; echo y; echo y; echo y; echo y; echo y) | $SDKMANAGER --licenses || true

          echo "=== INSTALANDO PLATAFORMA 28 Y BUILD-TOOLS 28.0.3 ==="
          $SDKMANAGER "platforms;android-28" "build-tools;28.0.3" "platform-tools"

          # 2. Aplicar el parche de compatibilidad contra el error 'base-extension'
          mkdir -p "$ANDROID_HOME/platforms/android-28/data"
          touch "$ANDROID_HOME/platforms/android-28/data/layoutlib.data"

          echo "=== SDK CONFIGURADO CON EXITO ==="

      # 3. Cambiar a JDK 11 (requerido por Android Gradle Plugin 7.x)
      - name: Set up JDK 11 for Gradle Build
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew

          echo "=== VERIFICANDO ENTORNO ==="
          java -version
          ./gradlew --version

          echo "=== INICIANDO COMPILACION ==="
          ./gradlew assembleDebug -x test -x lint --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adam-tunnel-app
          path: app/build/outputs/apk/debug/app-debug.apk
