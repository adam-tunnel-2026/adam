name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Android SDK
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROID_HOME="/usr/local/lib/android/sdk"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "=== JAVA FOR SDKMANAGER ==="
          java -version

          echo "=== ACCEPT LICENSES ==="
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          echo "=== INSTALL ANDROID 33 ==="
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "platform-tools"

          echo "=== SDK INSTALLATION COMPLETE ==="

      - name: Set up JDK 8 for Gradle
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Build APK
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROID_HOME="/usr/local/lib/android/sdk"

          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          chmod +x gradlew

          echo "=== JAVA FOR GRADLE ==="
          java -version

          echo "=== GRADLE VERSION ==="
          ./gradlew --version

          echo "=== CHECK API 33 ==="
          test -d "$ANDROID_SDK_ROOT/platforms/android-33"
          echo "API 33 OK"

          echo "=== CHECK BUILD TOOLS 33.0.0 ==="
          test -d "$ANDROID_SDK_ROOT/build-tools/33.0.0"
          echo "Build Tools 33.0.0 OK"

          echo "=== BUILD APK ==="
          ./gradlew assembleDebug --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adam-tunnel-app
          path: app/build/outputs/apk/debug/app-debug.apk
