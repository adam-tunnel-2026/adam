name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Android SDK
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROID_HOME="/usr/local/lib/android/sdk"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-28" \
            "platforms;android-33" \
            "build-tools;28.0.3" \
            "build-tools;33.0.0" \
            "platform-tools"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Prepare Gradle
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROID_HOME="/usr/local/lib/android/sdk"

          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          chmod +x gradlew

          echo "=== JAVA ==="
          java -version

          echo "=== GRADLE ==="
          ./gradlew --version

      - name: Build APK and save complete log
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROID_HOME="/usr/local/lib/android/sdk"

          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "=== CHECK API 28 ==="
          test -d "$ANDROID_SDK_ROOT/platforms/android-28"
          echo "API 28 OK"

          echo "=== CHECK BUILD TOOLS 28.0.3 ==="
          test -d "$ANDROID_SDK_ROOT/build-tools/28.0.3"
          echo "Build Tools 28.0.3 OK"

          echo "=== BUILD APK ==="

          set +e

          ./gradlew assembleDebug --stacktrace --info > build.log 2>&1

          STATUS=$?

          echo "=== GRADLE EXIT CODE ==="
          echo "$STATUS"

          echo "=== COMPILER / BUILD ERRORS ==="
          grep -n -E "error:|ERROR|FAILURE|Exception|cannot find symbol|does not exist|Could not" build.log | tail -n 100 || true

          echo "=== LAST 300 LINES ==="
          tail -n 300 build.log

          exit $STATUS

      - name: Upload complete Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-complete-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adam-tunnel-app
          path: app/build/outputs/apk/debug/app-debug.apk
