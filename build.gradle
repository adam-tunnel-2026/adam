// Top-level build file

buildscript {
    repositories {
        jcenter()
        mavenCentral()
        maven { url "https://google.com" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:2.1.3'
    }
}

allprojects {
    repositories {
        jcenter()
        mavenCentral()
        maven { url "https://google.com" }
        maven { url "https://jitpack.io" }
    }
}
